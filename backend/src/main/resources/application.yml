spring:
  datasource:
    url: jdbc:mysql://localhost:3306/restaurante_db?serverTimezone=America/Lima
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:cambiar}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:cambiar-esta-clave-en-application-local-yml}
    expiracion-minutos: 60